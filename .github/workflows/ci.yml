name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 让失败 PR 能看 log;同分支的新 push 取消旧跑
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13"]

    # **关键**:全部步骤用 bash,不用 Windows 默认的 pwsh。
    # pwsh 对原生命令的非零退出码**既不中断也不传播**(`powershell -Command
    # "cmd /c exit 3; echo done"` 整体退出码仍是 0),会让 Windows job 的
    # lint 步骤显示 success —— 三平台里唯一的假绿(实测本机复现)。
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install system ffmpeg (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
        # 实测缺 ffmpeg 时 video_client 探测会跑 30s+ 报错,加上更接近用户环境

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # 版本落盘:ruff/mypy 规则集只增不减,不锁版本的话「昨天绿今天红」,
          # 没人改代码也会红(2026-10-18 那轮实测 1660 个 ruff 错就是这么来的)。
          pip freeze > requirements-ci.lock.txt

      - name: Ruff lint
        run: |
          ruff check .
          # 顺便留一份分布快照,便于看问题往哪个方向漂
          ruff check . --statistics || true

      - name: Mypy type check
        # 门禁覆盖基础层 app/core + app/agents(见 pyproject.toml 的说明):
        # 上层 app/pipeline / app/ai 的存量类型债按模块逐步还。
        run: mypy

      - name: Pytest (headless)
        env:
          # headless Qt:Linux runner 没有显示器,必须 offscreen
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -q --timeout=120
          # 注意:不要加 `-x`。首败即停会让三平台每次只暴露第一个失败,
          # 修错效率低;跑完全量再汇总更快。
