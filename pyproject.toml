[project]
name = "pydrama"
version = "1.1.0"
description = "AI 短剧/小说/漫画一站式桌面制作工具(PySide6)"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "CC BY-NC-SA 4.0" }
authors = [{ name = "PySide6 Drama" }]
dependencies = [
    # **上限必须与 requirements.txt 一致(<6.10)**:>=6.10 的 Qt6Core.dll 依赖
    # ICU ≥74 的 icuuc.dll,而很多环境自带 ICU 73 → `import PySide6.QtCore`
    # 直接 "DLL load failed"(见 requirements.txt 顶部的完整说明)。
    # 这里只写下界的话,按 pyproject 装的人正好踩进被警告过的坑。
    "PySide6>=6.6.0,<6.10",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "edge-tts",
    "cryptography>=41.0",
    "numpy>=1.26",
    # 繁体中文内容语言的简→繁转换(app/core/zh_convert.py)
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
dev = [
    # 与 requirements-dev.txt 保持一致(钉上限,理由见那里)
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3.0",
    "types-requests",
    "pyinstaller>=6.0",
]
test = [
    "pytest>=8.0",
    "pytest-timeout>=2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "scripts*", "docs*", "data*", "workspace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
# 注:多数测试需要 QApplication(QWidget 实例),在 Linux/CI 用 offscreen
# 平台;本机 macOS/Windows 默认即可。设置项可由环境变量覆盖:
# QT_QPA_PLATFORM=offscreen python -m pytest tests/ -q

# ── Ruff ────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "app/assets",
    "workspace",
    "data",
    "build",
    "dist",
    ".venv",
    "venv",
    "tests/__pycache__",
]

[tool.ruff.lint]
# 启用现代默认集:语法错误 + 复杂度 + 风格 + 导入 + pyupgrade + bugbear + simplify
# BLE 一并启用 —— 全仓 391 处 `# noqa: BLE001` 此前因规则未启用而全被 RUF100
# 判成「无用 noqa」(444 个错误,占总量 27%)。启用后 noqa 恢复语义,
# 只剩 27 处真·裸 except 需要处理。
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "BLE"]
ignore = [
    "E501",   # 长行(formatter/手写折行常见)
    "B008",   # 默认参数里调函数(PySide6 Signal/slot 必需)
    "B904",   # raise from 在 print/异常吞掉路径不强制
    # 中文代码库的标点全是全角(,:;!?),RUF001/002/003 会把每一个中文标点都报成
    # "ambiguous unicode character" —— 全仓 2300+ 处纯误报,规则形同虚设。
    "RUF001",
    "RUF002",
    "RUF003",
    # ── pep8-naming 全局豁免(逐条有理由,不是"关掉拉倒")──
    "N812",   # `from ..core import taskmgr as _TM` —— 短别名是本仓既有约定(135 处)
    "N814",   # `from pathlib import Path as _P` / `QPixmap as _QP` —— 同上(15 处)
    "N806",   # `StateGraph` / `END` / `GROW` 当局部变量 —— LangGraph 等 SDK 的
              #   API 名本就是大驼峰,改成小写反而读不懂(21 处)
    # N815 **必须**豁免:`imageSaved` / `needSettings` / `openDesktopApp` 是
    #   Qt 的 Property/Signal 名,Qt meta-object 按 camelCase 查找,
    #   改成 snake_case 会**静默失效**(属性读不到、信号连不上,无报错)。
    #   13 处全在 chat_edit_drawer.py。
    "N815",
]

[tool.ruff.lint.per-file-ignores]
# Qt 类方法遵守 Qt 命名习惯
"app/ui/*" = ["N802", "N803", "N806", "E741"]
# 测试桩与 monkeypatch 常用易触发误报
"tests/*" = ["B011", "N802", "N803"]
# 导演台工程数据模型:dataclass 字段名必须与上游 DirectorDesk 的 JSON schema
# 逐字一致(targetId / promptText …),否则序列化出的工程原版不认
"app/pipeline/previz.py" = ["N815"]
# 一次性工具脚本(i18n 批处理 / 迁移 / 截图 / 启动):低频改动、语义由人读,
# 为过 lint 而改写 open()/printf 反而增加出错面 —— 一律放宽。
"scripts/*" = ["SIM115", "UP031", "B005", "N802", "N803", "B007", "SIM117", "B023"]
"tools/*" = ["SIM115", "UP031", "B005", "N802", "N803", "B007", "SIM117", "B023"]
# PhotoCraft 上游 API 的回调名(camelCase)是 Qt 侧的约定,改名会断开信号连接
"app/ai/photocraft_bridge.py" = ["N802"]
# 探测性导入 PIL 子模块:只为判断 cv2/PIL 是否可用,导入本身不调用
"app/ai/text_replace_skill.py" = ["F401"]
"app/ui/image_edit_dialog.py" = ["F401"]
# 异常类名是公共 API(调用点已存在),加 Error 后缀是破坏性改名
"app/ai/registry.py" = ["N818"]
"app/ai/video_client.py" = ["N818"]
# Windows 环境变量大小写不敏感,SystemRoot 是官方写法
"app/ai/tts_client.py" = ["SIM112"]

# ── Mypy ────────────────────────────────────────────────────────────────
# **渐进式收口**:门禁目前只覆盖「基础层」app/core + app/agents。
#
# 为什么不是全量:app/pipeline(尤其 novel.py 2.9k 行 / video_clone.py 2.9k 行)
# 与 app/ai 历史上从未做过类型标注,存量 mypy 报错约 250 条,集中在
# 「run_agent_json 返回 dict|list 未窄化」「sqlite3.Row 当 dict 用」
# 「PySide6 stub 与运行时枚举名不一致」三类。全量硬推要么花数周逐个加 cast,
# 要么把 250 条 noqa 灌进源码 —— 两者都会让「门禁」变成噪音。
#
# 因此本轮把门禁钉在基础层(core + agents):这两层是所有上层的地基,
# 守住它们的类型契约 = 挡住最要命的回归;上层存量作为**独立技术债**记录在
# AGENTS.md「类型收口」节,按模块逐步还。
#
# follow_imports=silent:基础层 import 上层模块时,上层自身的类型错误
# **不计入**本轮门禁(否则会被 import 链带进来,等于变相全量)。
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
disallow_incomplete_defs = false
files = [
    "app/core",
    "app/agents",
]

[[tool.mypy.overrides]]
# 上层模块:被 import 时静默(错误不报),但一旦纳入 files 仍会被检查
module = [
    "app.ai.*",
    "app.pipeline.*",
    "app.ui.*",
]
follow_imports = "silent"

[[tool.mypy.overrides]]
# taskmgr 与 logging_setup 暂不强制类型(回调多 + 反射多)
module = [
    "app.core.taskmgr",
    "app.core.logging_setup",
    "app.core.metrics",
]
ignore_errors = true
